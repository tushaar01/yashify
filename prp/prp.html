<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Research Project’s</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--yel:#ffd54f;--pink:#ff8fab;--blu:#7cc6ff;--grn:#9be28d;--vio:#c4a8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.1}
.title{font-family:'Titan One','Fredoka',sans-serif;font-weight:400;font-size:clamp(32px,8vw,60px);letter-spacing:1px;min-height:1.2em;text-align:center;color:#111;margin-top:6px}.home{display:block;text-align:center;color:#8C52FF;font-weight:600;text-decoration:none;margin-bottom:10px}.home:hover{text-decoration:underline}footer{margin-top:50px;text-align:center;font-weight:500;color:#111}footer b{color:#8C52FF}
.caret{display:inline-block;width:4px;height:.9em;background:var(--ink);margin-left:4px;vertical-align:-.1em;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.sub{margin:10px 0 14px;font-size:20px;font-weight:600;text-align:left}
.tabs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:0 0 40px;padding:0;list-style:none}
.tab{font:inherit;font-weight:500;font-size:16px;line-height:1.3;text-align:left;cursor:pointer;background:none;color:var(--ink);border:0;border-bottom:3px solid transparent;padding:4px 6px}
.tab:hover{border-bottom-color:#d9c8ff}
.tab[aria-selected=true]{font-weight:700;border-bottom-color:#8C52FF}
.tab:focus-visible,.pg:focus-visible{outline:3px solid var(--blu);outline-offset:3px}
.sec-title{font-family:'Titan One','Fredoka',sans-serif;font-weight:400;font-size:clamp(26px,6.6vw,50px);line-height:1.15;letter-spacing:.8px;color:#111;position:relative;display:block;text-align:center;margin-bottom:28px}
.sec-title svg{display:none}
.soon{border:2.5px dashed var(--ink);border-radius:24px;padding:34px 20px;text-align:center;font-size:20px;font-weight:500}
h2.exp{font-size:clamp(22px,4.6vw,32px)}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--grn);border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:600;font-size:15px;margin:12px 0 18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:b 1.2s steps(2) infinite}
.img{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--blu)}
.arrow{display:block;margin:6px auto;width:64px}
.pfn{display:grid;gap:16px}
.card{border:3px solid var(--ink);border-radius:22px;padding:14px 18px 16px;position:relative}
.card b.lab{display:inline-block;font-size:22px;margin-bottom:2px}
.c1{background:#fff0f3;box-shadow:4px 4px 0 var(--pink)}.c2{background:#eef8ff;box-shadow:4px 4px 0 var(--blu)}.c3{background:#fff8dc;box-shadow:4px 4px 0 var(--yel)}
.mid{width:44px;margin:-6px auto -6px;display:block}
.ic{height:36px;width:auto;flex:none;filter:drop-shadow(1px 0 0 #222) drop-shadow(-1px 0 0 #222) drop-shadow(0 1px 0 #222) drop-shadow(0 -1px 0 #222)}.ic.big{height:60px}.ic.h{height:50px}.chip{display:inline-flex;align-items:center;gap:8px;padding:2px 14px 2px 0}.lab .ic{height:30px;vertical-align:middle;margin-right:6px}.blk{margin-top:34px}
.blk h3{font-size:28px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.blk h3 svg{width:46px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 14px}
.chip{border:0;font-size:16px}
.k{font-weight:600;margin:12px 0 2px}
sub,sup{line-height:0}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center}
ol.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--vio);display:grid;place-items:center;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.obs{display:grid;gap:14px}
@media(min-width:640px){.obs{grid-template-columns:1fr 1fr}}
.res{background:var(--grn);border:3px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px 18px}
.res small{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:600;margin-bottom:6px}
.pages{display:flex;justify-content:center;gap:12px;margin-top:46px}
.pg{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:19px;cursor:pointer}
.pg[aria-current=page]{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.pgwrap{position:relative;text-align:center}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.caret,.dot{animation:none}.tab,.tab:hover{transition:none}}
</style></head><body><div class="wrap">

<div class="pfn">
<div class="card c1"><b class="lab">Problem</b><br>Paneer high moisture aur nutrient content ki wajah se 2–3 din ke andar rapid bacterial aur fungal spoilage se kharab ho jata hai.</div>
${dn}
<div class="card c2"><b class="lab">Fix</b><br>Fresh curd se isolated <i>Lactobacillus</i> ko sodium alginate matrix me incorporate karke paneer surface par dip-coat karna aur CaCl<sub>2</sub> se crosslink karana.</div>
${dn}
<div class="card c3"><b class="lab">Novelty</b><br>Synthetic chemical preservatives ke bina ek active, food-grade living protective biological barrier create karna.</div>
</div>

<section class="blk"><h3>Requirements ${ico('rack','h')}</h3>
<div class="k">Materials</div>
${chips(['cube|Fresh paneer cubes (2 × 2 cm)','mortar|Sodium alginate powder (2% w/v)','vial|Calcium chloride (CaCl<sub>2</sub>, 0.1 M)','bacteria|<i>Lactobacillus</i> culture (curd isolate, MRS Broth)','washbottle|Sterile deionized water','dropper|Peptone water (0.1%)'])}
<div class="k">Glassware</div>
${chips(['beaker|250 mL beakers','petri|Sterile petri plates','tweezers|Sterile forceps'])}
<div class="k">Instruments</div>
${chips(['ph|pH meter','hotplate|Magnetic stirrer','goggles|Laminar air flow hood','thermo|Refrigerator (4 °C)'])}
</section>

<section class="blk"><h3>Procedure ${ico('flask','h')}</h3>
${steps(['beaker|2% (w/v) sodium alginate solution ko distilled water me dissolve karke autoclave karein.','bacteria|Room temperature par cool hone ke baad usme active <i>Lactobacillus</i> cell pellet (10<sup>8</sup> CFU/mL) homogenously mix karein.','tweezers|Sterile forceps se paneer cubes ko is probiotic-alginate mixture me 2 minute ke liye dip karein.','vial|Cubes ko nikal kar 0.1 M CaCl<sub>2</sub> solution me 3 minute ke liye immerse karein taaki bio-film crosslink ho jaye.','petri|Uncoated paneer cubes ko control ki tarah rakhein aur coated cubes ko sterile petri plates me 4 °C par 7 din ke liye store karein.','microscope|Day 0, 3, 5, aur 7 par physical appearance, surface pH, aur total microbial viable count track karein.'])}
</section>

<section class="blk"><h3>Observation ${ico('microscope','h')}</h3>
<div class="obs">
<div class="card c1"><b class="lab">${ico('bacteria')}Control (uncoated)</b><br>Day 3–4 tak yellowish, slimy aur foul odor emit karta hai jisme visible mold patches dikhte hain.</div>
<div class="card c2"><b class="lab">${ico('petri')}Probiotic-coated</b><br>Day 7 tak structurally firm, white aur mold-free bana rehta hai.</div>
</div></section>

<section class="blk"><h3>Result ${ico('bulb','h')}</h3>

f:"Antagonistic <i>Pichia</i> yeast aur beneficial <i>Bacillus</i> strains ka bio-active microbial consortium spray formulate karke fruit surfaces par mist apply karna.",
n:"Chemical synthetic fungicides ke against safe dual-microbial biological barrier design karna jo post-harvest surface wounds par pathogen growth competitively suppress karta hai.",
m:["orange|Fresh, disease-free citrus fruits (oranges)","tube|Antagonistic <i>Pichia</i> yeast liquid broth culture","bacteria|<i>Bacillus subtilis</i> liquid broth culture","petri|Fungal test challenge: <i>Penicillium digitatum</i> spore suspension (10<sup>5</sup> spores/mL)","flask|Nutrient Broth, Potato Dextrose Agar (PDA), and sterile physiological saline (0.85% NaCl)","spray|Fine mist sterile spray applicator bottles","washbottle|Sodium hypochlorite solution (0.1%) surface disinfectant ke liye","syringe|Sterile puncture needle","ruler|Vernier caliper","thermo|Humidity storage chambers (25 °C)"],
s:["washbottle|Oranges ko 0.1% sodium hypochlorite solution me 2 minutes immerse karein, sterile water se rinse karein aur air-dry hone dein.","bacteria|<i>Pichia</i> aur <i>Bacillus</i> ke harvested cells ko equal ratio (1:1) me sterile saline me resuspend karke active consortium suspension prepare karein.","syringe|Sterile needle use karke har fruit ke flavedo (peel) par standard 2 mm deep wound create karein.","spray|Test group ke fruits par microbial consortium suspension ka uniform spray karein; control group par sterile distilled water spray karein.","petri|2 hours post-treatment ke baad sabhi wound sites par <i>Penicillium</i> spore suspension inoculate karein.","thermo|Sabhi fruits ko room temperature (25 °C) par high-humidity chambers me 7–10 days ke liye incubate karein.","ruler|Daily rotting incidence percentage aur lesion diameter vernier caliper se measure karke record karein."],
o:[["bacteria","Control (moldy)","Control group ke fruits me Day 3 se white hyphae develop hote hain jo Day 5–7 tak extensive green powdery spore rot me convert ho jate hain."],["orange","Bio-spray treated","Bio-spray treated fruits me puncture site completely dry rehta hai aur visible rot formation 7–10 days tak zero hoti hai."]],

p:"Conventional non-biodegradable plastic wrappers severe environmental waste generate karte hain aur bakery products me internal moisture condensation ke chalte fungal spoilage trigger karte hain.",
f:"Corn-starch matrix me glycerol plasticizer aur natural cinnamon essential oil extract incorporate karke active biodegradable packaging film cast karna.",
n:"Antimicrobial cinnamaldehyde-infused edible packaging alternative create karna jo contact aur volatile vapor dono modes se active microbial barrier provide kare.",
m:["starch|Commercial corn starch powder (5% w/v)","vial|Glycerol (plasticizer, 30% w/w based on dry starch weight)","cinnamon|Cinnamon essential oil / extract (1–2% v/v)","dropper|Tween-80 (food-grade emulsifier, 0.1%)","bread|Preservative-free fresh bread slices","beaker|500 mL glass beakers","petri|Flat glass casting trays / Teflon-coated plates","hotplate|Magnetic hot-plate stirrer","thermo|Hot air drying oven (40 °C)","ruler|Micrometer","scale|Analytical balance"],
s:["hotplate|Distilled water me corn starch add karke continuous stirring ke sath 85 °C tak heat karein jab tak gelatinization complete na ho jaye.","beaker|Viscous starch paste me glycerol add karein aur 15 minutes tak constant agitation maintain karein.","cinnamon|Mixture ko 50 °C tak cool hone dein, fir Tween-80 aur cinnamon extract blend karke homogeneous film emulsion banayein.","petri|Degassed film solution ko flat casting trays me uniform layer banakar pour karein.","thermo|Trays ko 40 °C oven me 24 hours dry karein aur dry flexible polymer films ko peel karein.","wrapped|Test bread slices ko prepared cinnamon bio-films me tightly wrap karein; control slices ko unwrapped/standard plastic sheet me place karein.","microscope|Specimens ko room temperature (25 °C) par 7 days tak daily fungal mycelium emergence ke liye observe karein."],
o:[["bacteria","Control (moldy)","Control bread slice par Day 3–4 ke andar black bread mold (<i>Rhizopus stolonifer</i>) ke dense colonies form ho jate hain."],["wrapped","Cinnamon bio-film","Cinnamon bio-film wrapped bread slices Day 7 tak completely clean, fresh, aur free of fungal colonies rehte hain."]],

function expN(d){return `
<h2 class="exp">${d.h}</h2>
<div class="tag"><span class="dot"></span>Ongoing research</div>
<p style="margin:0 0 16px;font-weight:700;font-size:21px;color:#8A0303">${d.t}</p>
<img class="img" alt="${d.alt}" src="${d.img}">
${curl}
<div class="pfn">
<div class="card c1"><b class="lab">Problem</b><br>${d.p}</div>
${dn}
<div class="card c2"><b class="lab">Fix</b><br>${d.f}</div>
${dn}
<div class="card c3"><b class="lab">Novelty</b><br>${d.n}</div>
</div>
<section class="blk"><h3>Requirements ${ico('rack','h')}</h3>${chips(d.m)}</section>
<section class="blk"><h3>Procedure ${ico('flask','h')}</h3>${steps(d.s)}</section>
<section class="blk"><h3>Observation ${ico('microscope','h')}</h3><div class="obs">${d.o.map((o,i)=>'<div class="card c'+(i%2?2:1)+'"><b class="lab">'+ico(o[0])+o[1]+'</b><br>'+o[2]+'</div>').join('')}</div></section>
<section class="blk"><h3>Result ${ico('bulb','h')}</h3><div class="res">${ico('bulb','big').replace('class="','style="float:right;margin:0 0 4px 10px" class="')}<small>Expected result</small><br>${d.r}</div></section>`}
function soon(t){return `<div class="soon">${t}<br><span style="font-weight:400;font-size:17px">Content jaldi aayega.</span></div>`}

function render(){
 const m=document.getElementById('main');
 let h=`<h2 class="sec-title">${HEAD[area]}<svg viewBox="0 0 56 48" aria-hidden="true"><use href="#burst"/></svg></h2>`;
 if(area>0) h+=soon('Is research area ka pehla experiment add hona baaki hai.');
 else if(page==1) h+=exp1();
 else h+=expN(D[page]);
 if(area===0){h+='<nav class="pages" aria-label="Experiment pages">'+[1,2,3,4].map(n=>`<button class="pg" data-p="${n}" ${n==page?'aria-current="page"':''}>${n}</button>`).join('')+'</nav>'}
 m.innerHTML=h;
 m.querySelectorAll('.pg').forEach(b=>b.onclick=()=>{page=+b.dataset.p;render();window.scrollTo({top:document.querySelector('.tabs').offsetTop-10})});
 document.querySelectorAll('.tab').forEach((b,i)=>b.setAttribute('aria-selected',i===area));
}
const tabs=document.getElementById('tabs');
AREAS.forEach((a,i)=>{const li=document.createElement('li');li.setAttribute('role','presentation');const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.textContent=(i+1)+'. '+a;b.onclick=()=>{area=i;page=1;render()};li.appendChild(b);tabs.appendChild(li)});
render();

const full='Personal Research Project’s',tt=document.getElementById('tt');
if(matchMedia('(prefers-reduced-motion:reduce)').matches){tt.textContent=full}
else{let i=0;(function k(){tt.textContent=full.slice(0,++i);if(i<full.length)setTimeout(k,85)})()}
</script></body></html>
