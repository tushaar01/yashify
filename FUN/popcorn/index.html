<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop & Score</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#FFF8DC,#FFE4B5);
  overflow:hidden;
  height:100vh;
  user-select:none;
}

#game-container{
  position:relative;
  width:100vw;
  height:100vh;
}

/* Header */
#header{
  position:absolute;
  top:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 40px;
  z-index:100;
}

/* 🔥 Attractive Title */
#title{
  font-size:40px;
  font-weight:900;
  letter-spacing:2px;
  color:#FF4500;
  text-shadow:
    2px 2px 0 #fff,
    4px 4px 0 #ffcc80,
    6px 6px 12px rgba(0,0,0,0.3);
}

#secret-emoji{
  cursor:pointer;
  font-size:36px;
  transition:transform .2s;
}

#secret-emoji:hover{
  transform:scale(1.2);
}

#score{
  font-size:32px;
  font-weight:bold;
  color:#FF8C00;
  background:rgba(255,255,255,0.85);
  padding:10px 20px;
  border-radius:15px;
}

/* 🍿 CSS POPCORN */
.popcorn{
  position:absolute;
  width:50px;
  height:50px;
  background:#fff;
  border-radius:50%;
  box-shadow:
    inset -5px -5px 0 #f2d37c,
    0 4px 8px rgba(0,0,0,.2);
  cursor:pointer;
  animation: fall linear;
  z-index:10;
}

.popcorn::after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  background:#f5c16c;
  border-radius:50%;
  top:8px;
  left:10px;
}

/* Falling */
@keyframes fall{
  from{ top:-60px; }
  to{ top:110vh; }
}

/* Pop animation */
@keyframes pop{
  0%{ transform:scale(1); opacity:1; }
  50%{ transform:scale(1.5); opacity:.8; }
  100%{ transform:scale(0); opacity:0; }
}

.popping{
  animation: pop .3s ease-out forwards !important;
}

/* Game Over */
#game-over{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.95);
  padding:40px 60px;
  border-radius:20px;
  text-align:center;
  display:none;
  z-index:200;
}

#game-over h2{
  font-size:48px;
  color:#FF6347;
}

#game-over p{
  font-size:24px;
  margin:20px 0;
}

#restart-btn{
  font-size:24px;
  padding:15px 40px;
  background:#FF6347;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="game-container">
  <div id="header">
    <div id="title"> POP & SCORE! <span id="secret-emoji">🍿</span></div>
    <div id="score">Score: 0</div>
  </div>

  <div id="game-over">
    <h2>Game Over!</h2>
    <p>Final Score: <span id="final-score">0</span></p>
    <button id="restart-btn">Play Again</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  const popSound = new Audio("https://www.genspark.ai/api/files/s/cQaDzTyX");
  const scoreSound = new Audio("https://www.genspark.ai/api/files/s/qm8QOzlD");

  let score = 0;
  let spawnSpeed = 1500;
  let interval;
  let gameActive = true;

  const container = document.getElementById("game-container");
  const scoreBox = document.getElementById("score");
  const gameOver = document.getElementById("game-over");
  const finalScore = document.getElementById("final-score");
  const restartBtn = document.getElementById("restart-btn");
  const secret = document.getElementById("secret-emoji");

  secret.onclick = () => location.href = "./8008&/";

  function createPopcorn(){
    if(!gameActive) return;

    const p = document.createElement("div");
    p.className = "popcorn";
    p.style.left = Math.random()*(window.innerWidth-60)+"px";
    const dur = 4 + Math.random()*2;
    p.style.animationDuration = dur+"s";

    p.onclick = (e)=>{
      e.stopPropagation();
      pop(p);
    };

    container.appendChild(p);

    setTimeout(()=>{
      if(p.parentElement && !p.classList.contains("popping")){
        p.remove();
      }
    }, dur*1000+100);
  }

  function pop(p){
    if(p.classList.contains("popping")) return;
    p.classList.add("popping");

    /* ✅ SCORE FIX: +1 */
    score += 1;
    scoreBox.textContent = "Score: "+score;

    popSound.currentTime = 0;
    popSound.play();

    if(score % 5 === 0){
      scoreSound.currentTime = 0;
      scoreSound.play();
    }

    setTimeout(()=>p.remove(),300);

    if(score % 10 === 0 && spawnSpeed > 500){
      spawnSpeed -= 200;
      clearInterval(interval);
      interval = setInterval(createPopcorn, spawnSpeed);
    }
  }

  function startGame(){
    score = 0;
    spawnSpeed = 1500;
    gameActive = true;
    scoreBox.textContent = "Score: 0";
    gameOver.style.display = "none";
    document.querySelectorAll(".popcorn").forEach(p=>p.remove());
    clearInterval(interval);
    interval = setInterval(createPopcorn, spawnSpeed);
  }

  restartBtn.onclick = startGame;
  startGame();

});
</script>

</body>
</html>
