<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

/* HERO */
.hero{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* WALL – angle via skew (safe) */
.wall{
  position:absolute;
  inset:-25%;
  display:flex;
  flex-direction:column;
  gap:16px;
  transform:skewY(-6deg);
}

/* ROW */
.row{
  display:flex;
  width:200%;
  animation:scrollLeft 40s linear infinite;
}
.row.reverse{
  animation:scrollRight 55s linear infinite;
}

/* TRACK (duplicate = seamless) */
.track{
  display:flex;
  gap:16px;
}

/* ANIMATION – exact half */
@keyframes scrollLeft{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
@keyframes scrollRight{
  from{transform:translateX(-50%)}
  to{transform:translateX(0)}
}

/* CARD */
.card{
  width:120px;
  height:180px;
  border-radius:10px;
  overflow:hidden;
  background:#111;
  flex-shrink:0;
}
.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.7;
  filter:brightness(.8);
}

/* CENTER */
.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.glass{
  background:rgba(0,0,0,.65);
  padding:32px 30px;
  border-radius:22px;
  text-align:center;
  color:#fff;
}
.glass h1{
  color:#e50914;
  letter-spacing:4px;
}
.glass p{
  margin-top:10px;
  letter-spacing:2px;
}
.badge{
  margin-top:18px;
  background:#e50914;
  padding:8px 22px;
  display:inline-block;
  border-radius:6px;
  font-weight:bold;
}

/* DESKTOP SCALE */
@media(min-width:900px){
  .card{width:220px;height:320px}
}
</style>
</head>
