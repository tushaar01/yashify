<style>
/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  min-height: 100vh;
  padding: 24px;
}

/* ===== PAGE CONTAINER ===== */
#page-content {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== HEADINGS ===== */
h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 2.4rem;
  font-weight: 600;
  margin: 18px 0 6px;
  color: #1f3c88;

}

.subtitle {

  color: #555;
  margin: 0 auto 34px;
  text-align: center;
  max-width: 360px;
  width: 100%;
  line-height: 1.5;
}

/* ===== LAYOUT ===== */
.main-container {
  display: flex;
  flex-direction: column;
  gap: 26px;
  width: 100%;
}

.row {
  display: flex;
  justify-content: center;
  gap: 22px;
}

/* ===== CARD ===== */
.card {
  background: #fff;
  width: 165px;
  height: 185px;
  border-radius: 14px;
  padding: 14px 16px 16px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.12);
  border: 1px solid #f0f0f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
}

.card-img {
  width: 110px;
  height: 110px;
  object-fit: contain;
}

.card h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: #1b1b1b;
}

a { text-decoration: none; color: inherit; }

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .main-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .row { display: contents; }
  .card { width: 100%; height: 175px; }
}
</style>
