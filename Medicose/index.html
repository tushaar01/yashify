window.addEventListener('load',function(){

// TYPEWRITER
var tw_txt='MEDICOSE';
var tw_i=0;
var tw_el=document.getElementById('heroTitle');
function runTypewriter(){
  tw_el.textContent=tw_txt.slice(0,tw_i);
  tw_i++;
  if(tw_i<=tw_txt.length) setTimeout(runTypewriter,120);
}
runTypewriter();

// CONFETTI
var launchConfetti=(function(){
  var canvas=document.getElementById('confettiCanvas');
  var ctx=canvas.getContext('2d');
  var pieces=[];
  var colors=['#8C52FF','#3ABFF8','#FBBF24','#EF4444','#A855F7','#34D399','#F472B6'];
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  window.addEventListener('resize',resize); resize();
  function Piece(){
    this.x=window.innerWidth/2; this.y=window.innerHeight/2;
    this.vx=(Math.random()-.5)*16; this.vy=(Math.random()-1.6)*14;
    this.w=7+Math.random()*8; this.h=4+Math.random()*4;
    this.color=colors[Math.floor(Math.random()*colors.length)];
    this.rot=Math.random()*Math.PI*2; this.rotV=(Math.random()-.5)*.2;
    this.alpha=1;
  }
  var aid=null;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(function(p){
      p.x+=p.vx; p.vy+=0.45; p.y+=p.vy;
      p.rot+=p.rotV; p.alpha=Math.max(0,p.alpha-.016);
      ctx.save(); ctx.globalAlpha=p.alpha;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    pieces=pieces.filter(function(p){ return p.alpha>0; });
    if(pieces.length) aid=requestAnimationFrame(loop);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  return function(){
    for(var i=0;i<120;i++) pieces.push(new Piece());
    if(aid) cancelAnimationFrame(aid);
    loop();
  };
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyAigw066zndWp5S8ecmbNa_su8S-SJ2o8c",

  messagingSenderId:"209589402846",
  appId:"1:209589402846:web:c6a47049dcbc9e6eed564f"
};
const app = initializeApp(cfg);
const db = getDatabase(app);
const likeRef = ref(db, 'stats/medicose_likes');

function isLiked(){ return localStorage.getItem('med_like') === '1'; }

function renderLike(n){
  var btn = document.getElementById('likeBtn');
  var ico = document.getElementById('likeIcon');
  var cnt = document.getElementById('likeCount');
  if(!btn) return;
  var liked = isLiked();
  btn.classList.toggle('liked', liked);
  ico.className = liked ? 'fas fa-heart' : 'far fa-heart';
  cnt.textContent = n >= 1000 ? (n/1000).toFixed(1)+'k' : n;
}

onValue(likeRef, function(snap){ renderLike(snap.val() || 0); });

window.toggleLike = function(){
  if(isLiked()){
    localStorage.removeItem('med_like');
    runTransaction(likeRef, function(c){ return Math.max((c||0)-1, 0); });
  } else {
    localStorage.setItem('med_like','1');
    runTransaction(likeRef, function(c){ return (c||0)+1; });
    launchConfetti();
    var ico = document.getElementById('likeIcon');
    ico.style.animation = 'none';
    ico.offsetWidth;
    ico.style.animation = 'heartPop .4s ease';
  }
};
</script>
