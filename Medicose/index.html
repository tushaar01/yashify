  <style>
    :root {
      /* Exact Colors from your design */
      --blue: #5D9CEC;
      --orange: #F0AD4E;
      --red: #D9534F;
      --green: #5CB85C;
      --purple: #9D55B8;
      --bg-gradient: linear-gradient(180deg, #EBF4FA 0%, #ffffff 100%);
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 3rem; /* Large and Bold */
      color: #2a5caa;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #5c6b7f;
      font-size: 1.1rem;
      margin-top: 10px;
      font-weight: 400;
    }

    /* --- The Layout Engine (Flexbox) --- */
    .container {
      display: flex;
      flex-wrap: wrap; /* Allows items to drop to next line */
      justify-content: center; /* Centers the items horizontally */
      gap: 25px; /* Space between cards */
      width: 100%;
      max-width: 1000px;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    /* --- Card Styling --- */
    .card-link {
      text-decoration: none;
      /* Desktop: approx 1/3 width minus gap. Ensures 3 per row. */
      flex: 0 1 300px; 
      display: flex; /* Fixes anchor tag height issues */
    }

    .card {
      width: 100%;
      border-radius: 30px; /* Very round corners like the image */
      padding: 30px 20px;
      text-align: center;
      color: white;
      transition: all 0.3s ease;
      
      /* The "Sticker" Double Border Effect */
      border: 5px solid rgba(255, 255, 255, 0.25); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      
      height: 220px; /* Fixed height for uniformity */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      top: 0;
    }

    /* Hover Effects */
    .card:hover {
      top: -10px; /* Physical lift effect */
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Icon Styling */
    .card-img {
      width: 65px; 
      height: 65px;
      object-fit: contain;
      margin-bottom: 15px;
      /* Forces icons to be White */
      filter: brightness(0) invert(1); 
      transition: transform 0.3s ease;
    }

    /* Icon bounces slightly on hover */
    .card:hover .card-img {
      transform: scale(1.1);
    }

    .card h2 {
      font-family: 'Oswald', sans-serif;
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .card span {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 8px;
      font-weight: 400;
      display: block;
    }

    /* --- Card Colors --- */
    .bg-blue { background-color: var(--blue); }
    .bg-orange { background-color: var(--orange); }
    .bg-red { background-color: var(--red); }
    .bg-green { background-color: var(--green); }
    .bg-purple { background-color: var(--purple); }

    /* --- Mobile Responsiveness --- */
    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; }
      .container { gap: 15px; padding: 20px; }
      
      /* On mobile, cards take full width */
      .card-link { flex: 0 1 100%; } 
      .card { height: 180px; border-radius: 20px; }
      .card h2 { font-size: 1.3rem; }
    }
  </style>
