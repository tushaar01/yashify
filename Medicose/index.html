<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDICOSE EXPLORER</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      margin: 15px 0 5px;
      color: #2a5caa;
      text-align: center;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 30px;
      text-align: center;
      max-width: 320px;
    }

    /* === MAIN WRAPPER === */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center; /* TRUE CENTER */
      gap: 20px;
    }

    /* === ROWS (WORD-LIKE CENTER) === */
    .row {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    /* === CARD DESIGN === */
    .card {
      background: #ffffff;
      width: 120px;
      height: 140px;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #333;
      transition: all 0.3s ease;
      text-align: center;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,168,255,0.25);
    }

    /* === BIGGER STICKERS === */
    .card-img {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    .card h2 {
      font-size: 0.85rem;
      margin: 0;
      font-weight: 600;
    }

    a {
      text-decoration: none;
    }

    /* === MOBILE FRIENDLY === */
    @media (max-width: 600px) {
      .row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <h1>MEDICOSE EXPLORER</h1>
  <div class="subtitle">
    Explore the marvels of human anatomy & medical science
  </div>

  <div class="main-container">

    <!-- ROW 1 : 3 CARDS -->
    <div class="row">
      <a href="organs/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/4861/4861778.png" class="card-img" alt="Human Anatomy">
          <h2>Human Anatomy</h2>
        </div>
      </a>

      <a href="physiology/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/4861/4861669.png" class="card-img" alt="Human Physiology">
          <h2>Human Physiology</h2>
        </div>
      </a>

      <a href="pharmacology/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/4861/4861715.png" class="card-img" alt="Pharmacy">
          <h2>Pharmacy</h2>
        </div>
      </a>
    </div>

    <!-- ROW 2 : 2 CARDS -->
    <div class="row">
      <a href="/course/dep/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/10130/10130124.png" class="card-img" alt="Microbio & Biotech">
          <h2>Microbio & Biotech</h2>
        </div>
      </a>

      <a href="models/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/7879/7879020.png" class="card-img" alt="3D Models">
          <h2>3D Models</h2>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
