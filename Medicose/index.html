<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDICOSE EXPLORER</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== BLUR ONLY PAGE CONTENT ===== */
    #page-content.blur {
      filter: blur(6px);
      pointer-events: none;
      user-select: none;
      transition: filter 0.3s ease;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.4rem;
      font-weight: 600;
      margin: 18px 0 6px;
      color: #1f3c88;
      text-align: center;
    }

    .subtitle {
      font-size: 1rem;
      color: #555;
      margin-bottom: 34px;
      text-align: center;
      max-width: 360px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 22px;
    }

    /* ===== CARD ===== */
    .card {
      background: #ffffff;
      width: 165px;
      height: 185px;
      border-radius: 14px;
      padding: 14px 16px 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
      border: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.03);
    }

    .card-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }

    .card h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #1b1b1b;
    }

    .coming-soon {
      background: linear-gradient(135deg, #ff9800, #ff5722);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 14px;
      letter-spacing: 0.6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== OVERLAY (CLEAR, NOT BLURRED) ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .countdown-box {
      background: #ffffff;
      padding: 32px 36px;
      border-radius: 18px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .countdown-box h2 {
      font-family: 'Poppins', sans-serif;
      margin-bottom: 6px;
      color: #1f3c88;
    }

    .launch-msg {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 14px;
    }

    .timer {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 10px;
      color: #000;
    }

    .close-btn {
      margin-top: 20px;
      padding: 9px 18px;
      border: none;
      background: #1f3c88;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<!-- ===== PAGE CONTENT (BLUR TARGET) ===== -->
<div id="page-content">

  <h1>MEDICOSE EXPLORER</h1>
  <div class="subtitle">
    Explore the marvels of human anatomy & medical science
  </div>

  <div class="main-container">

    <div class="row">
      <a href="organs/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/4861/4861778.png" class="card-img">
          <h2>Organs Overview</h2>
        </div>
      </a>

      <div class="card" onclick="openTimer()">
        <span class="coming-soon">COMING SOON</span>
        <img src="https://cdn-icons-png.flaticon.com/512/4861/4861669.png" class="card-img">
        <h2>Anatomy & Physiology</h2>
      </div>

      <div class="card" onclick="openTimer()">
        <span class="coming-soon">COMING SOON</span>
        <img src="https://cdn-icons-png.flaticon.com/512/4861/4861715.png" class="card-img">
        <h2>Pharmacy</h2>
      </div>
    </div>

    <div class="row">
      <a href="/course/dep/index.html">
        <div class="card">
          <img src="https://cdn-icons-png.flaticon.com/512/10130/10130124.png" class="card-img">
          <h2>Microbiology & Biotechnology</h2>
        </div>
      </a>

      <div class="card" onclick="openTimer()">
        <span class="coming-soon">COMING SOON</span>
        <img src="https://cdn-icons-png.flaticon.com/512/7879/7879020.png" class="card-img">
        <h2>3D Study</h2>
      </div>
    </div>

  </div>
</div>

<!-- ===== OVERLAY ===== -->
<div class="overlay" id="overlay">
  <div class="countdown-box">
    <h2>Launching Soon 🚀</h2>
    <div class="launch-msg">
      Preparing something powerful for medical students
    </div>
    <div class="timer" id="timer"></div>
    <button class="close-btn" onclick="closeTimer()">Close</button>
  </div>
</div>

<script>
  const targetDate = new Date("January 29, 2026 00:00:00").getTime();

  function openTimer() {
    document.getElementById("overlay").style.display = "flex";
    document.getElementById("page-content").classList.add("blur");
    updateTimer();
  }

  function closeTimer() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("page-content").classList.remove("blur");
  }

  function updateTimer() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").innerHTML =
      `${days} Days : ${hours} Hrs : ${minutes} Min : ${seconds} Sec`;
  }

  setInterval(updateTimer, 1000);
</script>

</body>
</html>
