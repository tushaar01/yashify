    /* ===== Splash Animation Styles ===== */
    .splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .splash.hide {
      opacity: 0;
      visibility: hidden;
    }
    .splash img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .splash .text {
      font-size: 1.5rem;
      margin-top: 1rem;
      color: #8C52FF;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #8C52FF;
      width: 0;
      animation: typing 2s steps(20,end) forwards, blink 0.8s infinite;
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 12ch }
    }
    @keyframes blink {
      50% { border-color: transparent }
    }
    .icon-fixed {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: none;
      animation: float 3s ease-in-out infinite;
      z-index: 10000;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    @keyframes fadeIn {

      to { opacity: 1; }
