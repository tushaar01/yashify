
  


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YASHIFY - A World for Curious Minds</title>

    <!-- PWA & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="512.png">
    <link rel="icon" type="image/png" href="512.png">
    <meta name="theme-color" content="#8C52FF">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B5X5RJM3XH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-B5X5RJM3XH');
</script>


    <style>
        /* ===== Custom Bristol Font for Splash ===== */
        @font-face {
            font-family: 'Bristol';
            src: url('https://raw.githubusercontent.com/tushaar01/yashify/main/Bristol.otf') format('opentype');
        }

        /* ===== VARIABLES ===== */
        :root {
            --bg-color: #F4F7FB;
            --text-main: #111827;
            --text-sub: #6B7280;
            --color-medicose: #3ABFF8;
            --color-library: #FBBF24;
            --color-fun: #A855F7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 0 20px;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.2;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        /* ===== CARDS ===== */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 40px auto;
            padding-bottom: 50px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-icon-img {
            width: 80px; height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .underline {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
            max-width: 80%;
        }

        /* COLORS */
        .medicose { border: 3px solid var(--color-medicose); }
        .medicose .underline { background: var(--color-medicose); }

        .library { border: 3px solid var(--color-library); }
        .library .underline { background: var(--color-library); }

        .fun { border: 3px solid var(--color-fun); }
        .fun .underline { background: var(--color-fun); }

        /* ===== SPLASH ===== */
        .splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #8C52FF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash.hide { opacity: 0; visibility: hidden; }

        .splash-text {
            font-family: 'Bristol', sans-serif;
            font-size: 2rem;
            color: white;
            border-right: 2px solid white;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2.5s steps(20,end) forwards, blink 0.8s infinite;
        }

        @keyframes typing { from {width: 0;} to {width: 14ch;} }
        @keyframes blink { 50% {border-color: transparent;} }

        /* Floating icon (top-left) */
        .icon-fixed {
            position: fixed;
            top: 16px; left: 16px;
            width: 44px; height: 44px;
            border-radius: 12px;
            display: none;
            animation: float 3s ease-in-out infinite;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        /* Floating Mailbox Button (top-right) */
        .mailbox-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #8C52FF;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            z-index: 10000;
            transition: 0.3s ease;
            font-size: 1.3rem;
        }
        .mailbox-btn:hover {
            transform: scale(1.12);
            background: #A855F7;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .footer-social a {
            color: #A855F7;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: 0.3s ease;
        }
        .footer-social a:hover {
            color: #7C3AED;
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .cards-container { grid-template-columns: 1fr; max-width: 400px; }

            .icon-fixed {
                width: 36px;
                height: 36px;
            }
            .mailbox-btn {
                width: 44px;
                height: 44px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <!-- SPLASH SCREEN -->
    <div class="splash" id="splash">
        <div class="splash-text">yashify.fun</div>
    </div>

    <!-- FLOATING ICON (left) -->
    <img src="https://raw.githubusercontent.com/tushaar01/yashify/main/icone.jpg"
         alt="Yashify" class="icon-fixed" id="fixedIcon">

    <!-- FLOATING MAILBOX BUTTON (right) -->
    <a href="mailto:admin@yashify.fun?subject=Problem%20Report&body=Please%20describe%20your%20issue%20here..."
       class="mailbox-btn" id="mailboxBtn">
        <i class="fas fa-envelope"></i>
    </a>

    <nav class="navbar">
        <div class="logo">YASHIFY</div>
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <section class="hero">
        <h1>A World for<br>Curious Minds</h1>
        <p>Learn Medicine | Read Stories | Unwind with Fun</p>
    </section>

    <div class="cards-container">
        <a href="Medicose/index.html" class="card medicose">
            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966334.png" class="card-icon-img" alt="Medicose">
            <h3>Medicose</h3>
            <div class="underline"></div>
            <p>Simplifying complex medical topics & notes</p>
        </a>

        <a href="L/library.html" class="card library">
            <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" class="card-icon-img" alt="Library">
            <h3>Library</h3>
            <div class="underline"></div>
            <p>Stories, Articles & Wisdom</p>
        </a>

        <a href="FUN/index.html" class="card fun">
            <img src="https://cdn-icons-png.flaticon.com/512/5260/5260498.png" class="card-icon-img" alt="Fun Zone">
            <h3>Fun Zone</h3>
            <div class="underline"></div>
            <p>Enjoy games and unwind instantly</p>
        </a>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Made with ❤️ by Yashify</p>
        <p>© <span id="year"></span> — All Rights Reserved</p>

        <div class="footer-social">
            <a href="https://www.instagram.com/yashify.fun" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </footer>

    <script>
        // Auto Year
        document.getElementById("year").textContent = new Date().getFullYear();

        // Splash Logic + Floating Icon
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            const fixedIcon = document.getElementById('fixedIcon');

            setTimeout(() => {
                splash.classList.add('hide');
                fixedIcon.style.display = "block";
            }, 3000);
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Service Worker registered'))
              .catch(err => console.error('Service Worker failed', err));
        }
    </script>

</body>
</html>
