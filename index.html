    <style>
        /* ===== Custom Bristol Font for Splash ===== */
        @font-face {
            font-family: 'Bristol';
            src: url('https://raw.githubusercontent.com/tushaar01/yashify/main/Bristol.otf') format('opentype');
        }

        /* ===== VARIABLES ===== */
        :root {
            --bg-color: #F4F7FB; /* Very light blue-ish white */
            --text-main: #111827;
            --text-sub: #6B7280;
            
            /* Card Colors */
            --color-medicose: #3ABFF8; /* Cyan/Blue */
            --color-library: #FBBF24;  /* Orange/Gold */
            --color-fun: #A855F7;      /* Purple */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 0 20px;
            overflow-x: hidden;
        }

        /* ===== 1. TOP NAVIGATION ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: black;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* ===== 2. HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.2;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* ===== 3. THE CARDS ===== */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 40px auto;
            padding-bottom: 50px;
        }

        .card {
            background: white;
            border-radius: 30px; /* Very Round corners */
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        /* Icons styling */
        .card-icon-img {
            width: 80px; 
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .underline {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
            max-width: 80%;
        }

        /* --- Specific Card Styles --- */
        
        /* Blue Card (Medicose) */
        .card.medicose {
            border: 3px solid var(--color-medicose);
            box-shadow: 0 10px 30px -10px rgba(58, 191, 248, 0.3);
        }
        .card.medicose:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(58, 191, 248, 0.5);
        }
        .card.medicose .underline { background: var(--color-medicose); }

        /* Orange Card (Library) */
        .card.library {
            border: 3px solid var(--color-library);
            box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.3);
        }
        .card.library:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(251, 191, 36, 0.5);
        }
        .card.library .underline { background: var(--color-library); }

        /* Purple Card (Fun Zone) */
        .card.fun {
            border: 3px solid var(--color-fun);
            box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3);
        }
        .card.fun:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(168, 85, 247, 0.5);
        }
        .card.fun .underline { background: var(--color-fun); }

        /* ===== UTILS & ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== SPLASH SCREEN (Pro version from old code) ===== */
        .splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #8C52FF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash.hide {
            opacity: 0;
            visibility: hidden;
        }
        .splash img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .splash-text {
            font-family: 'Bristol', 'Outfit', sans-serif;
            font-size: 2rem;
            margin-top: 1rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid white;
            width: 0;
            animation: typing 2.5s steps(20,end) forwards, blink 0.8s step-end infinite;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 12ch }
        }
        @keyframes blink {
            50% { border-color: transparent }
        }


  /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .footer-social a {
            color: #A855F7;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: 0.3s ease;
        }
        .footer-social a:hover {
            color: #7C3AED;
            transform: scale(1.1);
        }

       



        /* Floating Icon (top-left) */
        .icon-fixed {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: none;
            animation: float 3s ease-in-out infinite;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .cards-container { grid-template-columns: 1fr; max-width: 400px; }

            .icon-fixed {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>

<body>
    <!-- Splash Screen with typing effect -->
    <div class="splash" id="splash">
        <img src="https://raw.githubusercontent.com/tushaar01/yashify/main/icone.jpg" alt="Yashify Icon" id="splashIcon">
        <div class="splash-text">yashify.fun</div>
    </div>

    <!-- Floating Icon (appears after splash) -->
    <img src="https://raw.githubusercontent.com/tushaar01/yashify/main/icone.jpg" alt="Yashify" class="icon-fixed" id="fixedIcon">

    <nav class="navbar">
        <div class="logo">YASHIFY</div>
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <section class="hero">
        <h1>A World for<br>Curious Minds</h1>
        <p>Learn Medicine | Read Stories | Unwind with Fun</p>
    </section>

    <div class="cards-container">
        <a href="Medicose/index.html" class="card medicose">
            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966334.png" alt="Stethoscope" class="card-icon-img">
            <h3>Medicose</h3>
            <div class="underline"></div>
            <p>Simplifying complex medical topics & notes</p>
        </a>

        <a href="L/library.html" class="card library">
            <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="Book" class="card-icon-img">
            <h3>Library</h3>
            <div class="underline"></div>
            <p>Stories, Articles & Wisdom</p>
        </a>

        <a href="FUN/index.html" class="card fun">
            <img src="https://cdn-icons-png.flaticon.com/512/5260/5260498.png" alt="Gamepad" class="card-icon-img">
            <h3>Fun Zone</h3>
            <div class="underline"></div>
            <p>Enjoy games and unwind instantly</p>
        </a>
    </div>

    <script>
   
   
   <!-- ⭐⭐⭐ FOOTER WITH INSTAGRAM ⭐⭐⭐ -->
    <footer>
        <p>Made with ❤️ by Yashify</p>
        <p>© <span id="year"></span> — All Rights Reserved</p>

        <div class="footer-social">
            <a href="https://www.instagram.com/yashify.fun" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </footer>
   
   
   
   
   
   
        // Splash Logic with floating icon
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            const fixedIcon = document.getElementById('fixedIcon');

            setTimeout(() => {
                splash.classList.add('hide');
                fixedIcon.style.display = "block";
            }, 3000); // 3 seconds splash
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                  .then(reg => console.log('Service Worker registered'))
                  .catch(err => console.error('Service Worker failed', err));
            });
        }
    </script>

</body>
</html>
