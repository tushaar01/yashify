    <style>
        /* ===== VARIABLES (The Colors from your Image) ===== */
        :root {
            --bg-color: #F4F7FB; /* Very light blue-ish white */
            --text-main: #111827;
            --text-sub: #6B7280;
            
            /* Card Colors */
            --color-medicose: #3ABFF8; /* Cyan/Blue */
            --color-library: #FBBF24;  /* Orange/Gold */
            --color-fun: #A855F7;      /* Purple */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 0 20px;
            overflow-x: hidden;
        }

        /* ===== 1. TOP NAVIGATION ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: black;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* ===== 2. HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.2;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* ===== 3. THE CARDS (Magic Happens Here) ===== */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 40px auto;
            padding-bottom: 50px;
        }

        .card {
            background: white;
            border-radius: 30px; /* Very Round corners like image */
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        /* Icons styling */
        .card-icon-img {
            width: 80px; 
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .underline {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.4;
            max-width: 80%;
        }

        /* --- Specific Card Styles (The Glow & Border) --- */
        
        /* Blue Card (Medicose) */
        .card.medicose {
            border: 3px solid var(--color-medicose);
            box-shadow: 0 10px 30px -10px rgba(58, 191, 248, 0.3); /* Blue Glow */
        }
        .card.medicose:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(58, 191, 248, 0.5);
        }
        .card.medicose .underline { background: var(--color-medicose); }

        /* Orange Card (Library) */
        .card.library {
            border: 3px solid var(--color-library);
            box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.3); /* Orange Glow */
        }
        .card.library:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(251, 191, 36, 0.5);
        }
        .card.library .underline { background: var(--color-library); }

        /* Purple Card (Fun Zone) */
        .card.fun {
            border: 3px solid var(--color-fun);
            box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3); /* Purple Glow */
        }
        .card.fun:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(168, 85, 247, 0.5);
        }
        .card.fun .underline { background: var(--color-fun); }


        /* ===== UTILS & ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Splash Screen (Kept from your code) */
        .splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #8C52FF; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            color: white; font-size: 2rem; font-weight: bold;
        }
        .splash.hide { opacity: 0; visibility: hidden; }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .cards-container { grid-template-columns: 1fr; max-width: 400px; }
        }
    </style>

    <script>
        // Splash Logic
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            setTimeout(() => {
                splash.classList.add('hide');
            }, 2000); 
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                  .then(reg => console.log('Service Worker registered'))
                  .catch(err => console.error('Service Worker failed', err));
            });
        }
